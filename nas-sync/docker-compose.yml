services:
  xfinity-nas-sync:
    build: .
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NAS_ROOT: /data/Clients
      POLL_SECONDS: 30
      BATCH_SIZE: 5
      DELETE_STAGING_AFTER_SYNC: "false"
    volumes:
      - type: bind
        source: ${NAS_CLIENTS_PATH}
        target: /data/Clients
